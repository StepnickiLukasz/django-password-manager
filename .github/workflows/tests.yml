name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: | 
          python -m pip install --upgrade pip 
          pip install -e ".[dev]"

      - name: Run Black
        run: black --check .

      - name: Run isort
        run: isort --check-only .

      - name: Run Flake8
        run: flake8 .

  test:
    name: Test Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    needs:
      - lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            django-version: "5.2"

          - python-version: "3.12"
            django-version: "5.2"

          - python-version: "3.13"
            django-version: "5.2"

          - python-version: "3.14"
            django-version: "5.2"

          - python-version: "3.12"
            django-version: "6.0"

          - python-version: "3.13"
            django-version: "6.0"

          - python-version: "3.14"
            django-version: "6.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "Django~=${{ matrix.django-version }}.0"

      - name: Show versions
        run: |
          python --version
          python -m django --version

      - name: Run tests
        run: |
          pytest \
            --cov=django_password_manager \
            --cov-report=term-missing \
            --cov-fail-under=80

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build package
        run: python -m build